<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#202020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="三星计算器">
  <meta name="description" content="免费的离线流水计算器。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=20261027-saved-colors">
  <title>三星计算器</title>
</head>
<body>
  <main id="app" class="app">
    <section id="display" class="display" aria-label="计算流水">
      <header class="topbar">
        <button id="settingsButton" class="icon-button settings-icon" type="button" aria-label="设置">⚙</button>
        <span id="savedState" class="saved-state" aria-live="polite"></span>
      </header>
      <header id="samsungToolbar" class="samsung-toolbar" hidden>
        <button id="samsungHistoryToggle" type="button" aria-label="历史记录">
          <svg class="history-clock" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4a12 12 0 1 1-10.5 6.2M5 4v7h7M16 9v8l5 3"/></svg>
          <svg class="history-calculator" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="3" width="20" height="26" rx="3"/><path d="M10 8h12M11 15h2m5 0h2m-9 5h2m5 0h2m-9 5h2m5 0h2"/></svg>
        </button>
        <div>
          <button id="samsungConvert" type="button" aria-label="单位换算"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="10" width="22" height="12" rx="2" transform="rotate(-42 16 16)"/><path d="m13 12 2 2m2-6 2 2m2 8 2 2m-15-2 2 2"/></svg></button>
          <button id="samsungRoot" type="button" aria-label="计算平方根"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="22" height="22" rx="2"/><path d="m9 17 4 3 3-9 2 5h5"/></svg></button>
          <button id="samsungSettings" type="button" aria-label="设置"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 3h6l.8 3.2 2.2 1.3 3.2-1 3 5.2-2.4 2.2v2.4l2.4 2.2-3 5.2-3.2-1-2.2 1.3L19 29h-6l-.8-3.2-2.2-1.3-3.2 1-3-5.2 2.4-2.2v-2.4l-2.4-2.2 3-5.2 3.2 1 2.2-1.3z"/><circle cx="16" cy="16" r="4.1"/></svg></button>
        </div>
      </header>
      <button id="emberMenu" class="ember-menu" type="button" aria-label="更多选项" hidden>✧</button>
      <div id="ledger" class="ledger" aria-live="polite"></div>
      <div id="entryPanel" class="entry-panel">
        <button id="collapseButton" class="collapse-button" type="button" aria-label="收起键盘">⌄</button>
        <div id="entry" class="entry" aria-live="polite"><span id="entryText">0</span></div>
      </div>
      <div id="samsungPreview" class="samsung-preview" hidden></div>
      <div id="samsungHistoryPanel" class="samsung-history-panel" hidden>
        <button id="samsungClearHistory" class="samsung-clear-history" type="button">清除历史记录</button>
        <div class="samsung-operator-rail">
          <button data-samsung-key="÷">÷</button><button data-samsung-key="×">×</button>
          <button data-samsung-key="−">−</button><button data-samsung-key="+">+</button>
          <button data-samsung-key="=">=</button>
        </div>
      </div>
    </section>
    <section id="emberKeyboard" class="ember-keyboard" aria-label="橙黑风格计算键盘" hidden>
      <button class="ekey tool" data-ember-action="speaker" id="emberSpeaker" aria-label="声音">◖)))</button>
      <button class="ekey tool" data-samsung-key="(">(</button>
      <button class="ekey tool" data-samsung-key=")">)</button>
      <button class="ekey tool" data-ember-action="copy" aria-label="复制结果">▢</button>
      <button class="ekey utility" data-samsung-key="C">AC</button>
      <button class="ekey utility" data-samsung-key="sign">−/+</button>
      <button class="ekey utility" data-samsung-key="%">%</button>
      <button class="ekey operator" data-samsung-key="÷">÷</button>
      <button class="ekey" data-samsung-key="7">7</button><button class="ekey" data-samsung-key="8">8</button><button class="ekey" data-samsung-key="9">9</button><button class="ekey operator" data-samsung-key="×">×</button>
      <button class="ekey" data-samsung-key="4">4</button><button class="ekey" data-samsung-key="5">5</button><button class="ekey" data-samsung-key="6">6</button><button class="ekey operator" data-samsung-key="−">−</button>
      <button class="ekey" data-samsung-key="1">1</button><button class="ekey" data-samsung-key="2">2</button><button class="ekey" data-samsung-key="3">3</button><button class="ekey operator" data-samsung-key="+">+</button>
      <button class="ekey" data-samsung-key="0">0</button><button class="ekey" data-samsung-key=".">.</button><button class="ekey" data-samsung-key="back" aria-label="退格">⌫</button><button class="ekey operator" data-samsung-key="=">=</button>
    </section>
    <nav id="emberTabbar" class="ember-tabbar" aria-label="橙黑主题导航" hidden>
      <button type="button" data-ember-tab="calculator" class="active"><span>▦</span>计算器</button>
      <button type="button" data-ember-tab="settings"><span>☷</span>设置</button>
      <button type="button" data-ember-tab="more"><span>•••</span>更多</button>
    </nav>
    <section id="samsungKeyboard" class="samsung-keyboard" aria-label="三星风格计算键盘" hidden>
      <button class="skey utility" data-samsung-key="C" aria-label="清除，长按切换声音">C</button>
      <button class="skey utility" data-samsung-key="back" aria-label="退格">⌫</button>
      <button class="skey" data-samsung-key="%">%</button>
      <button class="skey operator" data-samsung-key="÷">÷</button>
      <button class="skey" data-samsung-key="7">7</button>
      <button class="skey" data-samsung-key="8">8</button>
      <button class="skey" data-samsung-key="9">9</button>
      <button class="skey operator" data-samsung-key="×">×</button>
      <button class="skey" data-samsung-key="4">4</button>
      <button class="skey" data-samsung-key="5">5</button>
      <button class="skey" data-samsung-key="6">6</button>
      <button class="skey operator" data-samsung-key="−">−</button>
      <button class="skey" data-samsung-key="1">1</button>
      <button class="skey" data-samsung-key="2">2</button>
      <button class="skey" data-samsung-key="3">3</button>
      <button class="skey operator" data-samsung-key="+">+</button>
      <button class="skey" data-samsung-key="()">()</button>
      <button class="skey" data-samsung-key="0">0</button>
      <button class="skey" data-samsung-key=".">.</button>
      <button class="skey equal" data-samsung-key="=">=</button>
    </section>
    <section id="keyboard" class="keyboard" aria-label="计算键盘">
      <button class="key function" data-key="C">C</button>
      <button class="key function" data-key="÷">÷</button>
      <button class="key function" data-key="×">×</button>
      <button class="key function" data-key="back" aria-label="退格">←</button>
      <button class="key number" data-key="7">7</button>
      <button class="key number" data-key="8">8</button>
      <button class="key number" data-key="9">9</button>
      <button class="key function" data-key="−">−</button>
      <button class="key number" data-key="4">4</button>
      <button class="key number" data-key="5">5</button>
      <button class="key number" data-key="6">6</button>
      <button class="key function" data-key="+">+</button>
      <button class="key number" data-key="1">1</button>
      <button class="key number" data-key="2">2</button>
      <button class="key number" data-key="3">3</button>
      <button class="key function equals" data-key="=">=</button>
      <button class="key number zero" data-key="0">0</button>
      <button class="key number" data-key=".">.</button>
    </section>
    <footer id="archiveBar" class="archive-bar" hidden>
      <button id="archiveButton" type="button">存档</button>
      <button id="clearButton" type="button">清空</button>
    </footer>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <section id="settings" class="settings-page" role="dialog" aria-modal="true" hidden>
    <header class="settings-header"><button id="settingsBack" type="button" aria-label="返回">‹</button><strong>设置</strong><span></span></header>
    <div class="settings-scroll">
      <div class="settings-group">
        <button class="setting-row" data-setting="voice">声音 <span id="voiceValue">普通话物理计算器 ›</span></button>
        <button class="setting-row" data-setting="theme">主题 <span id="themeValue">薄荷绿 ›</span></button>
        <label class="setting-row">触感 <input id="hapticSetting" type="checkbox" role="switch"></label>
      </div>
      <div class="settings-group">
        <button class="setting-row" data-setting="keyboard">键盘 <span id="keyboardValue">经典 ›</span></button>
        <button class="setting-row" data-setting="fontSize">字体大小 <span id="fontSizeValue">标准 ›</span></button>
        <button class="setting-row" data-setting="precision">小数位数 <span id="precisionValue">4 位 ›</span></button>
        <label class="setting-row">千分位 <input id="groupingSetting" type="checkbox" role="switch"></label>
        <label class="setting-row">日期 <input id="dateSetting" type="checkbox" role="switch"></label>
        <label class="setting-row">量级（万） <input id="unitSetting" type="checkbox" role="switch"></label>
      </div>
      <div class="settings-group">
        <button class="setting-row" data-setting="archive">存档 <span>›</span></button>
        <button class="setting-row" data-setting="trash">回收站 <span>›</span></button>
      </div>
      <p class="settings-note">长按 C 可切换声音。记录只保存在这台设备上。</p>
    </div>
  </section>
  <section id="converter" class="converter-page" role="dialog" aria-modal="true" aria-label="单位换算" hidden>
    <header class="converter-header"><button id="converterBack" type="button" aria-label="返回计算器">‹</button><strong>单位换算</strong><span></span></header>
    <nav id="converterCategories" class="converter-categories" aria-label="换算类别"></nav>
    <div class="converter-values">
      <div class="converter-card"><div class="converter-card-head"><span>从</span><select id="converterFrom" aria-label="原单位"></select></div><div id="converterInput" class="converter-number" aria-live="polite">0</div></div>
      <button id="converterSwap" class="converter-swap" type="button" aria-label="交换单位">⇅</button>
      <div class="converter-card output"><div class="converter-card-head"><span>到</span><select id="converterTo" aria-label="目标单位"></select></div><button id="converterOutput" class="converter-number" type="button" aria-label="复制换算结果">0</button></div>
      <p class="converter-hint">点击结果即可复制</p>
    </div>
    <div id="converterKeyboard" class="converter-keyboard" aria-label="换算数字键盘">
      <button data-converter-key="7">7</button><button data-converter-key="8">8</button><button data-converter-key="9">9</button><button class="utility" data-converter-key="back" aria-label="退格">⌫</button>
      <button data-converter-key="4">4</button><button data-converter-key="5">5</button><button data-converter-key="6">6</button><button class="utility" data-converter-key="clear">C</button>
      <button data-converter-key="1">1</button><button data-converter-key="2">2</button><button data-converter-key="3">3</button><button class="utility" data-converter-key="sign">±</button>
      <button data-converter-key="00">00</button><button data-converter-key="0">0</button><button data-converter-key=".">.</button><button class="confirm" data-converter-key="copy">复制</button>
    </div>
  </section>
  <section id="soundPage" class="sound-page" role="dialog" aria-modal="true" hidden>
    <header class="sound-header"><button id="soundBack" type="button" aria-label="返回">‹</button><strong>声音</strong><span></span></header>
    <div class="sound-scroll">
      <h2>真人发音</h2>
      <div class="sound-group">
        <button data-voice="none">无<span></span></button>
        <button data-voice="default">默认语音<span></span></button>
        <button data-voice="mandarin">普通话物理计算器<span></span></button>
        <button data-voice="male">普通话男声<span></span></button>
        <button data-voice="female">普通话女声<span></span></button>
      </div>
      <h2>音效</h2>
      <div class="sound-group">
        <button data-voice="click">点击声<span></span></button>
      </div>
      <p>按键读数，按等号后用中文读出结果。普通话物理计算器声音来自本机内置录音。</p>
    </div>
  </section>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="./bundle.js?v=20261027-saved-colors"></script>
</body>
</html>
